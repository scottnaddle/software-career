# Netlify Configuration File
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

# Headers for security and performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# API proxy for Supabase (optional) - must come before SPA redirect
[[redirects]]
  from = "/api/*"
  to = "https://your-project-ref.supabase.co/:splat"
  status = 200
  force = false

# SPA redirect rules - must be last to catch all unmatched routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200